<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interior Design</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300;400;500;600&family=Noto+Sans+Thai:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--h:min(84vh,62vw);--w:calc(var(--h)*.74);--head:'Barlow Condensed','Noto Sans Thai',sans-serif;--thai:'Noto Sans Thai',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#1a0f12}
body{font-family:var(--thai);overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 70% 60% at 85% 8%,rgba(255,150,90,.18),transparent 60%),linear-gradient(160deg,#33201a,#1a0f12 55%,#120a10);overflow:hidden}
.bg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(to top,rgba(122,74,72,.35),transparent);clip-path:polygon(0 60%,15% 40%,35% 55%,55% 30%,75% 50%,100% 35%,100% 100%,0 100%)}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#ffe2b5;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.1}to{opacity:.9}}
.glow{position:absolute;width:60vw;height:40vw;border-radius:50%;background:radial-gradient(closest-side,rgba(255,170,100,.22),transparent);animation:dr 26s ease-in-out infinite alternate}
.g1{left:-15vw;bottom:-10vh}.g2{right:-15vw;top:5vh;animation-duration:34s;animation-delay:-10s}
@keyframes dr{from{transform:translateX(-6vw)}to{transform:translateX(8vw) translateY(-3vh)}}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none}
.wrap{position:fixed;inset:0;z-index:2;display:grid;place-items:center;perspective:2600px}
.stage{transform-style:preserve-3d;transform:rotateX(calc(9deg + var(--my,0)*-5deg)) rotateY(calc(var(--mx,0)*8deg))}
.book{position:relative;width:calc(var(--w)*2);height:var(--h);transform-style:preserve-3d;transition:translate 1.2s cubic-bezier(.5,0,.2,1)}
.book::after{content:"";position:absolute;left:4%;right:4%;bottom:-3.5vh;height:4vh;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);filter:blur(8px);transform:translateZ(-1px)}
.book::before{display:none!important} /* Remove paper strip that protruded beyond cover */
.book{filter:drop-shadow(0 1.8vh 2.8vh rgba(0,0,0,.28))}
.leaf{position:absolute;left:var(--w);top:0;width:var(--w);height:100%;transform-origin:left center;transform-style:preserve-3d;z-index:calc(100 - var(--i));transition:transform 1.2s cubic-bezier(.6,0,.25,1),z-index 0s linear .6s}
.leaf.f{transform:rotateY(-180deg);z-index:calc(100 + var(--i))}
.pg{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;container-type:size;color:var(--fg)}
.back{transform:rotateY(180deg)}
.pg::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:rgba(30,12,8,.6)}
.tn .pg::after{animation:sh 1.2s ease}
@keyframes sh{0%{opacity:0}45%{opacity:.5}100%{opacity:0}}
.pp{--fg:#2b1b16;--mu:#6b5547;--ac:#b66f4b;--ln:rgba(43,27,22,.22);--gs:rgba(182,111,75,.38)}
.pp.front{background:linear-gradient(90deg,rgba(70,35,22,.32),rgba(70,35,22,.08) 6%,transparent 15%),radial-gradient(ellipse at 30% 15%,#f7eddc,#eadcc3);border-radius:0 4px 4px 0}
.pp.back{background:linear-gradient(270deg,rgba(70,35,22,.32),rgba(70,35,22,.08) 6%,transparent 15%),radial-gradient(ellipse at 70% 15%,#f7eddc,#eadcc3);border-radius:4px 0 0 4px}
.lea{--fg:#f6ebdd;--mu:rgba(246,235,221,.7);--ac:#ffb27c;--ln:rgba(246,235,221,.3);--gs:rgba(255,178,124,.3);background:radial-gradient(circle at 62% 18%,rgba(210,118,79,.22),transparent 34%),radial-gradient(circle at 50% 65%,rgba(22,10,14,.35),transparent 56%),linear-gradient(160deg,#4b2c22 0%,#24141a 56%,#11070d 100%);box-shadow:inset 0 0 0 1px rgba(255,245,233,.02),inset 2.6cqw 0 3.4cqw rgba(0,0,0,.34),inset -.9cqw 0 1.6cqw rgba(255,190,145,.05)}
.lea.front{border-radius:0 10px 10px 0}.lea.back{border-radius:10px 0 0 10px}
.lea::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4.8cqw;background:linear-gradient(90deg,rgba(0,0,0,.58),rgba(255,178,124,.13) 48%,rgba(0,0,0,.08));box-shadow:inset -1px 0 0 rgba(255,220,183,.08);pointer-events:none}
.lea::after{content:"";position:absolute;inset:2.6cqw 2.2cqw 2.6cqw 4.4cqw;border-radius:.9cqw 1.2cqw 1.2cqw .9cqw;box-shadow:inset 0 0 0 1px rgba(255,178,124,.10), inset 0 0 5cqw rgba(255,178,124,.035);pointer-events:none}
.lea.front{box-shadow:inset -0.45cqw 0 1.2cqw rgba(0,0,0,.22), inset -0.12cqw 0 0 rgba(211,179,140,.22)}
.pc{position:absolute;inset:0;padding:12cqw 11cqw;display:flex;flex-direction:column;justify-content:center}
.pc.c{align-items:center;text-align:center}
.h{margin:0;font:200 13cqw/.92 var(--head);letter-spacing:.05em;text-transform:uppercase}
.h.sm{font-size:11cqw}
.th{margin:0;font:200 10.5cqw/1.2 var(--thai)}
.cl{display:block;font-size:17cqw;line-height:.84;letter-spacing:.07em}
.cover .cl{text-shadow:0 0 40px rgba(255,174,119,.18),0 2px 10px rgba(0,0,0,.22);letter-spacing:.09em}
.cover .nm{letter-spacing:.1em;color:rgba(246,235,221,.58)}
.cover .rule{height:9cqw;margin:5cqw auto;background:linear-gradient(rgba(255,178,124,.75),transparent)}
.cover .hint{bottom:8cqw;opacity:.7}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;opacity:0;transform:translateY(.5em) scaleY(1.2);transition:opacity .6s ease,transform .7s ease}
.vis .ch{opacity:1;transform:none;transition:opacity .9s ease calc(.7s + var(--i,0)*50ms),transform 1s cubic-bezier(.2,.7,.1,1) calc(.7s + var(--i,0)*50ms)}
.r{opacity:0;filter:blur(6px);transform:translateY(3cqw);transition:opacity .5s,filter .5s,transform .5s}
.vis .r{opacity:1;filter:none;transform:none;transition:opacity .9s ease var(--d,.8s),filter .9s ease var(--d,.8s),transform .9s cubic-bezier(.2,.7,.1,1) var(--d,.8s)}
.dash{display:block;width:10cqw;height:1px;background:var(--ac);margin:4cqw 0}
.c .dash{margin:4cqw auto}
.tg{margin:0;font:300 4.4cqw/1.6 var(--thai);letter-spacing:.05em;color:var(--mu)}
.nm{margin:0;font:300 3.3cqw/1.8 var(--thai);letter-spacing:.14em;color:var(--mu)}
.rule{display:block;width:1px;height:12cqw;margin:6cqw auto;background:linear-gradient(var(--ac),transparent)}
ul{margin:5cqw 0 0;padding:0;list-style:none}
li{position:relative;padding-left:7cqw;font:300 4.6cqw/1.95 var(--thai);letter-spacing:.03em}
li::before{content:"";position:absolute;left:0;top:.98em;width:4cqw;height:1px;background:var(--ac)}
.g{margin-top:7cqw}
.it{display:flex;align-items:baseline;gap:4cqw;padding:1.9cqw 0;border-top:1px solid var(--ln)}
.it.col{flex-direction:column;gap:.6cqw;padding:2.6cqw 0}
.it b{font:300 4.9cqw/1.4 var(--thai)}
.it span{font:300 3.6cqw/1.6 var(--thai);color:var(--mu)}
.it i{font:400 3.4cqw/1 var(--head);letter-spacing:.2em;color:var(--ac);font-style:normal}
.it em{font:300 4.7cqw/1.3 var(--head);letter-spacing:.04em;font-style:normal}
.pal{display:flex;gap:3cqw;margin-top:9cqw}
.pal i{width:10.5cqw;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 1px rgba(43,27,22,.3)}
.ghost{position:absolute;right:-2cqw;bottom:-8cqw;font:200 62cqw/.8 var(--head);color:transparent;-webkit-text-stroke:1px var(--gs);pointer-events:none;opacity:0;transform:translateY(8cqw);transition:opacity .5s,transform .5s}
.back .ghost{right:auto;left:-2cqw}
.vis .ghost{opacity:1;transform:none;transition:opacity 1.4s .6s,transform 1.6s cubic-bezier(.2,.7,.1,1) .6s}
.fo{position:absolute;bottom:6cqw;font:400 3cqw/1 var(--head);letter-spacing:.25em;color:var(--mu)}
.front .fo{right:9cqw}.back .fo{left:9cqw}
.arch{position:absolute;left:24cqw;right:24cqw;top:22cqw;bottom:22cqw;border:1px solid var(--ac);border-radius:999px 999px 0 0;opacity:.7}
.arch.in{left:30cqw;right:30cqw;top:28cqw;bottom:22cqw;opacity:.4}
.hint{position:absolute;bottom:11cqw;left:0;right:0;text-align:center;font:300 4.5cqw/1 var(--head);letter-spacing:.5em;color:var(--mu);animation:pu 2.3s ease-in-out infinite alternate}
@keyframes pu{from{opacity:.3}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.book,.leaf,.ch,.r,.ghost{transition:none!important}.star,.glow,.hint,.tn .pg::after{animation:none}#fx{display:none}}

/* Image spreads: genuine photo areas remain visible even without photo files */
.pc.room,.pc.profile,.pc.mood {justify-content:flex-start;padding:10cqw 9cqw 9cqw}
.pc.room .h{font-size:10.5cqw;line-height:1.02;overflow-wrap:anywhere}
.pc.room .tg{font-size:3.65cqw;line-height:1.45;margin-top:2cqw}
.pc.room .dash{margin:3cqw 0}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2cqw;width:100%;min-height:0;flex:1;margin-top:5cqw}
.gallery.one{grid-template-columns:1fr}
.gallery.three{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.gallery.three .slot:first-child{grid-row:span 2}
.slot{position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid rgba(140,101,71,.4);background:linear-gradient(140deg,#e3d3b9,#d0bea2);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:1cqw;color:#836c55}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.slot img.ready{opacity:1}
.slot .photo-icon{font-size:10cqw;line-height:1}
.slot .photo-label{font:400 3.2cqw/1.35 var(--thai);padding:0 2cqw}
.slot .photo-file{font:300 2.6cqw/1.3 var(--head);overflow-wrap:anywhere;padding:0 2cqw}
.slot:has(img.ready) .photo-icon,.slot:has(img.ready) .photo-label,.slot:has(img.ready) .photo-file{display:none}
.pc.profile .th{font-size:9cqw}
.pc.profile ul{margin:2cqw 0}
.pc.profile li{font-size:3.25cqw;line-height:1.5;padding-left:5cqw}
.pc.profile li::before{width:3cqw;top:.8em}
.pc.profile .gallery{flex:1;margin-top:2cqw;min-height:32cqw}
.pc.mood .h{font-size:10cqw}
.pc.mood .pal{margin-top:4cqw}
.pc.mood .gallery{margin-top:5cqw}
.pc.room .g{margin:2cqw 0 0}
.pc.room .it.col{padding:1cqw 0}
.pc.room .it.col b{font-size:3.5cqw}
.pc.room .ghost{display:none}
/* Distinct paper sheet remains visible at the midpoint of a flip */
.leaf{will-change:auto}
.leaf .pg{transform-style:preserve-3d;-webkit-backface-visibility:hidden}

/* Layout refinements - original physical 3D book and turn motion preserved */
.pc.content-page{justify-content:flex-start;align-items:stretch;overflow:auto;padding:10cqw 9cqw 9cqw;scrollbar-width:thin;scrollbar-color:#bfa98c transparent}
.content-page .h{font-size:11cqw;line-height:1.0;overflow-wrap:anywhere}
.content-page .h.sm{font-size:9.5cqw}
.content-page .th{font-size:7cqw;font-weight:300;line-height:1.2}
.eyebrow{margin:0 0 2cqw;font:400 2.75cqw/1.4 var(--head);letter-spacing:.15em;color:#a15d43}
.detail-intro{font:300 3.65cqw/1.72 var(--thai);color:#554133;margin:3cqw 0 4cqw}
.profile-blocks{display:grid;grid-template-columns:1fr 1fr;gap:3cqw 4cqw;margin-top:4cqw}
.profile-block{padding-top:2cqw;border-top:1px solid #bcaa92;min-width:0}
.profile-block h3{font:400 2.45cqw/1.4 var(--head);letter-spacing:.045em;color:#a15d43;margin:0 0 1cqw;overflow-wrap:anywhere}
.profile-block ul{margin:0}.profile-block li{font-size:2.7cqw;line-height:1.48;padding-left:4cqw;letter-spacing:0}
.profile-block li::before{width:2.2cqw;top:.8em}
.pc.gallery-page{padding:4cqw;justify-content:stretch;overflow:hidden}
.gallery-page .gallery{flex:1;margin:0;min-height:0;width:100%}
.gallery.four{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.gallery.five{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.gallery:has(>.slot:nth-child(5)){grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.gallery:has(>.slot:nth-child(5)) .slot:first-child{grid-row:span 2}
.slot{border-radius:2px}.slot .photo-icon{font-size:10cqw}.slot .photo-file{font-size:2.9cqw}
.slot .image-source{position:absolute;z-index:4;right:1cqw;bottom:1cqw;background:#211810d9;padding:1cqw 1.4cqw;text-decoration:none;color:#f7ead9;font:400 2.3cqw var(--head);letter-spacing:.1em;opacity:0;transition:opacity .2s}
.slot:hover .image-source,.slot .image-source:focus-visible{opacity:1}
.item-detail{border-top:1px solid #c9b9a3;padding:2.1cqw 0}
.item-detail strong{display:block;font:400 3.45cqw/1.4 var(--thai);color:#a15d43}
.item-detail p{margin:.5cqw 0 0;color:#574534;font:300 3cqw/1.5 var(--thai)}
.zone-en{font:400 2.3cqw var(--head);color:#a15d43;letter-spacing:.1em}
.fn-grid{display:grid;grid-template-columns:1fr 1fr;gap:2cqw 3cqw;margin-top:4cqw}
.fn-item{border-top:1px solid #cbbba2;padding:2cqw 0;font:300 3.25cqw/1.35 var(--head);overflow-wrap:anywhere}
.fn-item span{color:#a15d43;display:block;font-size:2.5cqw;margin-bottom:1cqw}
.style-name{font:400 4cqw var(--head);letter-spacing:.15em;color:#a15d43;margin:5cqw 0}
.content-page .pal{margin-top:4cqw}.content-page .pal i{width:11cqw}
/* Ensure image source actions are directly clickable on the 3D page */
.slot .image-source{opacity:1!important;z-index:30!important;pointer-events:auto!important;cursor:pointer!important;display:flex;align-items:center;justify-content:center;min-width:76px;min-height:32px;right:1cqw;bottom:1cqw;border:1px solid rgba(255,240,220,.35);border-radius:3px;user-select:none}
.slot .image-source:hover{background:#6c4530!important}
.slot{isolation:isolate}
/* Make 3D facing sides remain visible and avoid browser compositing flashes */
.leaf,.pg{backface-visibility:visible}.pg{backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(0)}
.pg.back{transform:rotateY(180deg)}


/* Typography clarity patch: preserve original 3D book + content */
.stage{transform:rotateX(calc(4deg + var(--my,0)*-2deg)) rotateY(calc(var(--mx,0)*3deg))}
.h{font-weight:400}
.th{font-weight:400}
.cover .cl{font-weight:400;letter-spacing:.075em;text-shadow:0 1px 1px rgba(0,0,0,.14)}
.nm,.tg,.detail-intro,.item-detail p,.profile-block li,.fn-item,.fn-item span,.profile-block h3,.item-detail strong,.style-name,.eyebrow,.zone-en{font-weight:400}
.nm{color:var(--mu)}
.lea .nm{color:rgba(255,246,236,.84)}
.content-page .detail-intro,.content-page .item-detail p,.content-page .profile-block li{color:#382820}
.r{filter:none!important;transition:opacity .65s ease,transform .65s ease!important}
.vis .r{filter:none!important}
.ch{filter:none!important}
.pg,.pc{ -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility }


/* LEGIBILITY PATCH: text is readable at presentation viewing distance */
.stage{transform:none!important}
.book{filter:none!important}
.pg{ -webkit-font-smoothing:auto; text-rendering:optimizeLegibility }
.pc.content-page{padding:8cqw 8cqw 7cqw}
.content-page .th{font-size:7.7cqw!important;font-weight:500!important;line-height:1.18;color:#241b16}
.profile-blocks{grid-template-columns:1fr;gap:2cqw;margin-top:4cqw}
.profile-block{padding:2.4cqw 0 0}
.profile-block h3{font:500 3.55cqw/1.4 var(--thai)!important;color:#8d3f28!important;letter-spacing:0!important;margin-bottom:1.6cqw}
.profile-block li{font:400 3.85cqw/1.55 var(--thai)!important;color:#241a16!important;padding-left:4.5cqw!important;letter-spacing:0!important}
.profile-block li::before{width:2.4cqw;top:.85em;background:#a24d31}
.eyebrow{font-size:3.2cqw!important;color:#914e36!important;font-weight:500!important}
.content-page .detail-intro,.content-page .item-detail p{font-size:3.8cqw!important;color:#2b211c!important;line-height:1.6}
.item-detail strong{font-size:4cqw!important}
.fn-item{font-size:3.7cqw!important;color:#2b211c}
.pc.content-page{scrollbar-color:#b79b77 #e9ddc7}

/* FIX: All content must stay inside a single paper page; no internal scrollbars. */
.pc.content-page{overflow:hidden!important;scrollbar-width:none!important;padding:7.4cqw 8cqw 6.5cqw!important}
.pc.content-page::-webkit-scrollbar{display:none!important}
.pc.profile-details .th{font-size:7cqw!important;line-height:1.14!important;margin:0 0 1.5cqw!important}
.pc.profile-details .eyebrow{font-size:2.8cqw!important;margin:0 0 1.5cqw!important}
.pc.profile-details .profile-blocks{display:flex!important;flex-direction:column!important;gap:1.45cqw!important;margin-top:2.6cqw!important;align-content:start}
.pc.profile-details .profile-block{padding:1.1cqw 0 0!important;min-width:0}
.pc.profile-details .profile-block h3{font:500 2.35cqw/1.32 var(--thai)!important;color:#8d3f28!important;letter-spacing:0!important;margin:0 0 .55cqw!important;overflow-wrap:break-word}
.pc.profile-details .profile-block ul{margin:0!important;padding:0!important}
.pc.profile-details .profile-block li{font:400 2.42cqw/1.34 var(--thai)!important;color:#241a16!important;padding-left:2.9cqw!important;letter-spacing:0!important;overflow-wrap:anywhere}
.pc.profile-details .profile-block li::before{width:1.7cqw!important;top:.76em!important}
.pc.profile-details .profile-block:nth-child(4) li{font-size:2.3cqw!important;line-height:1.32!important}
.pc.profile-details .eyebrow{margin-bottom:1.2cqw!important}
.pc.profile-details .th{margin-bottom:1.2cqw!important}
.pc.profile-details .profile-block + .profile-block{margin-top:.1cqw!important}
/* The rest of the pages stay as laid out, without their own scroll regions. */
.pc.room-details .detail-intro{font-size:3.5cqw!important;line-height:1.53!important}
.pc.room-details .item-detail{padding:1.35cqw 0!important}
.pc.room-details .item-detail p{font-size:3.05cqw!important;line-height:1.44!important}
.pc.room-details .item-detail strong{font-size:3.3cqw!important}
.pc.user-needs .h{font-size:10.1cqw!important;line-height:1.0!important}
.pc.user-needs .detail-intro{font-size:3.25cqw!important;line-height:1.45!important;margin:2.1cqw 0 2.8cqw!important}
.pc.user-needs .item-detail{padding:1.55cqw 0!important}
.pc.user-needs .item-detail strong{font-size:3.45cqw!important;line-height:1.28!important}
.pc.user-needs .item-detail p{font-size:3.1cqw!important;line-height:1.42!important}
.pc.content-page .h{line-height:1.05!important}


/* Full image is the source link: no visible SOURCE button. */
.slot .image-source,
.slot:hover .image-source,
.slot .image-source:focus-visible{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  display:block!important;
  padding:0!important;
  margin:0!important;
  border:0!important;
  border-radius:0!important;
  background:transparent!important;
  box-shadow:none!important;
  opacity:1!important;
  transform:none!important;
  z-index:30!important;
  cursor:pointer!important;
  pointer-events:auto!important;
  min-width:0!important;
  min-height:0!important;
}
.slot .image-source:focus-visible{outline:2px solid #b66f4b!important;outline-offset:-2px!important}

/* Living Area / image-side composition: background + independently sourced objects */
.pc.composition-page{padding:4cqw!important;overflow:hidden!important}
.living-composition{position:relative;width:100%;height:100%;overflow:hidden;background:#d4c4ab;isolation:isolate;border-radius:2px}
.composition-bg{position:absolute;inset:0;z-index:0;background:linear-gradient(145deg,#ded3c2,#bcae97);overflow:hidden}
.composition-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.composition-bg .comp-empty{position:absolute;inset:0;display:grid;place-items:center;white-space:pre-line;text-align:center;padding:5%;font:400 3.2cqw/1.55 var(--thai);color:#513d2f;background:#dfd2bd}

function closeToCover(){

  if(idx<0){
   s=0;

   vis();

  }

  lf.classList.remove('tn'); void lf.offsetWidth; lf.classList.add('tn');
  lf.classList.remove('f');
  s=idx;

  vis();
  wind=8;
  idx--;
  setTimeout(step,58);

}
function go(d){

function sourceNotice(msg){

function resolveSourceHit(target){
 var anchor=target.closest('a.image-source,a.ref-link,a.comp-link,a.comp-bg-source');
 if(anchor){return {url:anchor.getAttribute('href'),name:anchor.getAttribute('aria-label')||'ภาพนี้'}};
 var item=target.closest('.comp-item,.composition-bg,.living-reference,.slot');
 if(!item)return null;
 var img=item.querySelector('img[data-photo]');
 if(!img)return null;
 var name=img.getAttribute('data-photo');
 var link=imageSources[name]||item.getAttribute('data-source')||'';
 // Custom mood boards define item-level source URLs, which may not be in imageSources.
 if(!link && item.classList.contains('comp-item')){
  var comp=item.closest('.living-composition');
  var list=comp && comp.querySelectorAll('.comp-item');
  if(list){
   var i=Array.prototype.indexOf.call(list,item);
   var allConfigs=[livingComposition,diningComposition,kitchenComposition,powderComposition,bedroom1Composition,closetComposition,masterBathComposition,bedroom2Composition,bathroom2Composition];
   Object.keys(extraMoodBoards).forEach(function(k){allConfigs.push(extraMoodBoards[k])});
   var config=allConfigs.find(function(c){return c&&c.label===comp.getAttribute('data-board-label')});
   if(config && config.items[i])link=config.items[i].source||'';
  }
 }
 if(!link && item.classList.contains('composition-bg')){
  var holder=item.closest('.living-composition');
  var bgAnchor=item.querySelector('a.comp-bg-source');
  if(bgAnchor)link=bgAnchor.getAttribute('href')||'';
 }
 return {url:link,name:name};
}
document.addEventListener('click',function(e){
 var hit=resolveSourceHit(e.target);
 if(!hit)return;
 e.stopPropagation();
 e.preventDefault();
 if(/^https?:\/\//i.test(hit.url||'')){
  window.open(hit.url,'_blank','noopener,noreferrer');
 }else{
  sourceNotice('ภาพ '+hit.name+' ยังไม่ได้ใส่ลิงก์ — ไปที่ easyImageLinks ต้นไฟล์ HTML');
 }
},true);
