<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interior Design — Book Presentation</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ========================================================
   รูปแบบเว็บ: ปรับสี/ขนาดหนังสือใน :root เท่านั้น
   เนื้อหาและรูปทั้งหมดแก้ได้ที่ส่วน "แก้ข้อมูลเว็บตรงนี้" ด้านล่าง
   ======================================================== */
:root {
  --h: min(84vh, 62vw);
  --w: calc(var(--h) * .74);
  --head: 'Barlow Condensed', 'Noto Sans Thai', sans-serif;
  --thai: 'Noto Sans Thai', sans-serif;
  /* ==============================================================
     ✏️✏️ จุดปรับฟอนต์ทุกหน้า — แก้เลขตรงนี้อย่างเดียว ✏️✏️
     Ctrl + F แล้วค้นหา "ตั้งค่าฟอนต์แยกหมวด"

     เพิ่มตัวเลข = ฟอนต์ใหญ่ขึ้น / ลดตัวเลข = ฟอนต์เล็กลง
     ตัวอย่าง 3.5cqw -> 4cqw หรือ 3cqw
     หน่วย cqw ขยายย่อตามความกว้างของหน้าหนังสือ
     ไม่ต้องแก้ font-size ที่อื่น และไม่ต้องแก้ JavaScript
     ============================================================== */

  /* ===== 01. ปกหน้า INTERIOR DESIGN ===== */
  --size-cover-title: 15cqw;            /* คำว่า INTERIOR / DESIGN */
  --size-cover-overline: 2.95cqw;       /* DESIGN PRESENTATION */
  --size-cover-name: 3.4cqw;           /* ชื่อและรหัสใต้ปก */
  --size-cover-hint: 3.4cqw;           /* ลูกศรบอกให้พลิกหน้า */

  /* ===== 02. หน้า PROFILE & LIFESTYLE ===== */
  --size-profile-overline: 2.95cqw;     /* PROFILE & LIFESTYLE / 01 */
  --size-profile-title: 5.9cqw;        /* ชื่ออาจารย์ */
  --size-profile-section: 3.55cqw;     /* Character, Daily Routine, User need */
  --size-profile-text: 2.80cqw;        /* รายละเอียดในแต่ละหมวด */

  /* ===== 03. หน้า USER NEEDS ===== */
  --size-needs-title: 8.2cqw;          /* USER NEEDS */
  --size-needs-intro: 3.00cqw;         /* คำอธิบายใต้หัวข้อ */
  --size-needs-section: 3.55cqw;       /* 01 / พื้นที่พักผ่อน เป็นต้น */
  --size-needs-text: 2.80cqw;          /* คำอธิบายแต่ละข้อ */

  /* ===== 04. หน้า LIST OF FUNCTION ===== */
  --size-function-title: 8.2cqw;       /* LIST OF FUNCTION */
  --size-function-category: 3.55cqw;   /* PUBLIC / PRIVATE / EXTERIOR */
  --size-function-item: 3.8cqw;        /* Living Area / Dining Area ฯลฯ */

  /* ===== 05. หน้า MOOD & TONE ===== */
  --size-mood-title: 8.2cqw;           /* MOOD & TONE */
  --size-mood-style: 3.55cqw;          /* MODERN NATURAL */
  --size-mood-description: 2.80cqw;    /* ย่อหน้าคอนเซปต์ */
  --size-mood-inspiration-title: 3.55cqw; /* INSPIRATION */
  --size-mood-inspiration-text: 2.80cqw;/* ข้อความ Inspiration */

  /* ===== 06. หน้ารายละเอียดห้องทุกห้อง ===== */
  --size-room-overline: 2.95cqw;       /* ROOM 01 / SPECIAL FUNCTION */
  --size-room-title: 8.2cqw;           /* Living Area / Master Bedroom ฯลฯ */
  --size-room-description: 3.20cqw;    /* ข้อความรายละเอียดห้อง */
  --size-room-tone-label: 3.55cqw;     /* TONE COLOR */

  /* ===== 07. ข้อความตำแหน่งรูป (กรณียังไม่ได้ใส่ภาพ) ===== */
  --size-image-filename: 3.4cqw;       /* ชื่อรูปในหน้ารวมรูป */
  --size-mood-image-filename: 2.95cqw; /* ชื่อรูปใน 5 ช่อง MOOD */
  --size-room-image-placeholder: 3.4cqw; /* ภาพตัวอย่างห้อง */
  --size-board-title: 8.2cqw;          /* MOOD & TONE หน้าภาพรวมแต่ละห้อง */
  --size-board-roomname: 3.4cqw;       /* ชื่อห้องใต้ MOOD & TONE */
  --size-board-filename: 2.95cqw;      /* ชื่อไฟล์รูป Mood Board */

  /* ===== 08. หน้า THANK YOU ===== */
  --size-thank-title: 15cqw;           /* THANK / YOU */
  --size-thank-name: 3.4cqw;           /* ชื่อและรหัสใต้หน้า */

  color-scheme: dark;


  .detail-intro {
    white-space: pre-line;
  }


}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: #1a0f12; }
body { overflow: hidden; font-family: var(--thai); }

/* พื้นหลังและอนุภาค */
.bg { position: fixed; inset: 0; overflow: hidden; z-index: 0;
  background: radial-gradient(ellipse 70% 60% at 85% 8%, rgba(255,150,90,.18), transparent 60%), linear-gradient(160deg,#33201a,#1a0f12 55%,#120a10); }
.bg::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 22%;
  background: linear-gradient(to top,rgba(122,74,72,.35),transparent);
  clip-path: polygon(0 60%,15% 40%,35% 55%,55% 30%,75% 50%,100% 35%,100% 100%,0 100%); }
.glow { position: absolute; width: 60vw; height: 40vw; border-radius: 50%;
  background: radial-gradient(closest-side,rgba(255,170,100,.22),transparent); animation: drift 26s ease-in-out infinite alternate; }
.g1 { left:-15vw; bottom:-10vh; }
.g2 { right:-15vw; top:5vh; animation-duration:34s; animation-delay:-10s; }
.star { position:absolute; width:2px; height:2px; border-radius:50%; background:#ffe2b5; animation:twinkle 3s ease-in-out infinite alternate; }
@keyframes drift { from {transform:translateX(-6vw)} to {transform:translate(8vw,-3vh)} }
@keyframes twinkle { from {opacity:.1} to {opacity:.9} }
#fx { position:fixed; inset:0; z-index:1; pointer-events:none; }

/* โมเดลหนังสือและเอฟเฟกต์เปิดหน้า */
.wrap { position:fixed; inset:0; z-index:2; display:grid; place-items:center; perspective:2600px; }
.stage { transform-style:preserve-3d; }
.book { position:relative; width:calc(var(--w) * 2); height:var(--h); transform-style:preserve-3d;
  transition:translate 1.2s cubic-bezier(.5,0,.2,1); }
.book::after { content:''; position:absolute; left:4%; right:4%; bottom:-3.5vh; height:4vh;
  background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent); filter:blur(8px); transform:translateZ(-1px); }
.leaf { position:absolute; left:var(--w); top:0; width:var(--w); height:100%; transform-origin:left center;
  transform-style:preserve-3d; z-index:calc(100 - var(--i)); transition:transform 1.2s cubic-bezier(.6,0,.25,1),z-index 0s linear .6s; }
.leaf.f { transform:rotateY(-180deg); z-index:calc(100 + var(--i)); }
.pg { position:absolute; inset:0; overflow:hidden; container-type:size; color:var(--fg);
  backface-visibility:hidden; -webkit-backface-visibility:hidden; transform:translateZ(0);
  text-rendering:optimizeLegibility; }
.pg.back { transform:rotateY(180deg); }
.pg::after { content:''; position:absolute; inset:0; pointer-events:none; opacity:0; background:rgba(30,12,8,.6); }
.tn .pg::after { animation:page-shadow 1.2s ease; }
@keyframes page-shadow { 0%,100%{opacity:0} 45%{opacity:.5} }
.pp { --fg:#2b1b16; --mu:#6b5547; --ac:#b66f4b; --ln:rgba(43,27,22,.22); }
.pp.front { background:linear-gradient(90deg,rgba(70,35,22,.32),rgba(70,35,22,.08) 6%,transparent 15%),radial-gradient(ellipse at 30% 15%,#f7eddc,#eadcc3); border-radius:0 4px 4px 0; }
.pp.back { background:linear-gradient(270deg,rgba(70,35,22,.32),rgba(70,35,22,.08) 6%,transparent 15%),radial-gradient(ellipse at 70% 15%,#f7eddc,#eadcc3); border-radius:4px 0 0 4px; }
.lea { --fg:#f6ebdd; --mu:rgba(255,246,236,.84); --ac:#ffb27c; --ln:rgba(246,235,221,.3);
  background:radial-gradient(circle at 62% 18%,rgba(210,118,79,.22),transparent 34%),radial-gradient(circle at 50% 65%,rgba(22,10,14,.35),transparent 56%),linear-gradient(160deg,#4b2c22,#24141a 56%,#11070d);
  box-shadow:inset 0 0 0 1px rgba(255,245,233,.02),inset 2.6cqw 0 3.4cqw rgba(0,0,0,.34); }
.lea.front { border-radius:0 10px 10px 0; box-shadow:inset -.45cqw 0 1.2cqw rgba(0,0,0,.22),inset -.12cqw 0 0 rgba(211,179,140,.22); }
.lea.back { border-radius:10px 0 0 10px; }
.lea::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4.8cqw;
  background:linear-gradient(90deg,rgba(0,0,0,.58),rgba(255,178,124,.13) 48%,rgba(0,0,0,.08)); pointer-events:none; }
.lea::after { content:''; position:absolute; inset:2.6cqw 2.2cqw 2.6cqw 4.4cqw; border-radius:.9cqw 1.2cqw 1.2cqw .9cqw;
  box-shadow:inset 0 0 0 1px rgba(255,178,124,.10),inset 0 0 5cqw rgba(255,178,124,.035); pointer-events:none; }

/* ตัวหนังสือทั่วไป */
.pc { position:absolute; inset:0; padding:12cqw 11cqw; display:flex; flex-direction:column; justify-content:center; }
.pc.c { align-items:center; text-align:center; }
.h { margin:0; font:400 var(--size-room-title)/1.08 var(--head); letter-spacing:.035em; text-transform:uppercase; }
.cl { display:block; font-size:var(--size-cover-title); line-height:.91; letter-spacing:.05em; }
.th { margin:0; font:500 var(--size-profile-title)/1.2 var(--thai); }
.eyebrow { margin:0 0 1.6cqw; font:500 var(--size-room-overline)/1.4 var(--head); letter-spacing:.11em; color:#914e36; }
.dash { display:block; width:10cqw; height:1px; background:var(--ac); margin:3cqw 0; }
.nm { margin:0; font:400 var(--size-cover-name)/1.6 var(--thai); letter-spacing:.08em; color:var(--mu); }
.rule { display:block; width:1px; height:9cqw; margin:6cqw auto; background:linear-gradient(var(--ac),transparent); }
.cover .eyebrow { font-size:var(--size-cover-overline); }
.cover .cl { font-size:var(--size-cover-title); text-shadow:0 1px 1px rgba(0,0,0,.14); }
.cover .nm { font-size:var(--size-cover-name); color:rgba(246,235,221,.58); }
.thank-you-page .cl { font-size:var(--size-thank-title); }
.thank-you-page .nm { font-size:var(--size-thank-name); }
.hint { position:absolute; bottom:11cqw; left:0; right:0; text-align:center;
  font:400 var(--size-cover-hint)/1 var(--head); letter-spacing:.35em; color:var(--mu); animation:twinkle 2.3s ease-in-out infinite alternate; }
.arch { position:absolute; left:24cqw; right:24cqw; top:22cqw; bottom:22cqw; border:1px solid var(--ac); border-radius:999px 999px 0 0; opacity:.7; }
.arch.in { left:30cqw; right:30cqw; top:28cqw; opacity:.4; }
.r { opacity:0; transform:translateY(3cqw); transition:opacity .65s ease, transform .65s ease; }
.vis .r { opacity:1; transform:none; transition-delay:.6s; }

/* เนื้อหา PROFILE / USER NEEDS / คำอธิบายห้อง */
.pc.content-page { justify-content:flex-start; padding:8cqw 8.2cqw 7cqw; overflow:hidden; }
.content-page .h { font-size:var(--size-room-title); line-height:1.08; overflow-wrap:anywhere; }
.content-page .detail-intro { margin:2.8cqw 0 2.5cqw; font:400 var(--size-room-description)/1.55 var(--thai); color:#33251d; }
.profile-details .th { font-size:var(--size-profile-title); line-height:1.2; margin-bottom:1.8cqw; color:#241b16; }
.profile-details .eyebrow { font-size:var(--size-profile-overline); }
.profile-blocks { display:flex; flex-direction:column; gap:1.9cqw; margin-top:2.5cqw; }
.profile-block { padding-top:1.5cqw; border-top:1px solid #bcaa92; min-width:0; }
.profile-block h3 { font:500 var(--size-profile-section)/1.32 var(--thai); color:#8d3f28; margin:0 0 .7cqw; }
.profile-block ul { list-style:none; margin:0; padding:0; }
.profile-block li { position:relative; font:400 var(--size-profile-text)/1.43 var(--thai); color:#241a16; padding-left:3.3cqw; overflow-wrap:anywhere; }
.profile-block li::before { content:''; position:absolute; left:0; top:.76em; width:1.7cqw; height:1px; background:#a24d31; }
/* ทุกหมวดใน Profile ใช้ขนาดเดียวกัน ไม่มีการแอบย่อเฉพาะหมวด User need */
.item-detail { border-top:1px solid #c9b9a3; padding:2.1cqw 0; }
.item-detail strong { display:block; font:500 var(--size-needs-section)/1.32 var(--thai); color:#a15d43; }
.item-detail p { margin:.65cqw 0 0; font:400 var(--size-needs-text)/1.48 var(--thai); color:#33251d; }
.user-needs .h { font-size:var(--size-needs-title); }
.user-needs .detail-intro { font-size:var(--size-needs-intro); line-height:1.52; margin:2.6cqw 0 3.2cqw; }
.user-needs .item-detail strong { font-size:var(--size-needs-section); }

/* LIST OF FUNCTION — 5 หมวด */
.pc.function-index-page { justify-content:flex-start; padding:8cqw 8cqw 7cqw; overflow:hidden; color:#31241e; font-family:var(--head); }
.function-index-head .eyebrow { font-size:var(--size-function-category); margin:0 0 1.2cqw; }
.function-index-title { margin:0; font:500 var(--size-function-title)/1.05 var(--head); letter-spacing:.035em; }
.function-index-head .dash { width:12cqw; margin:2.3cqw 0 2.7cqw; }
.function-index-head-right .dash { margin:0 0 2.7cqw; }
.function-index-group { margin:0 0 2.05cqw; }
.function-index-group h3 { margin:0 0 1cqw; font:500 var(--size-function-category)/1.3 var(--head); letter-spacing:.12em; color:#a15d43; }
.function-index-item { padding:.8cqw 0; border-top:1px solid #cbbba2; }
.function-index-name { font:500 var(--size-function-item)/1.32 var(--head); color:#31241e; overflow-wrap:break-word; }

/* หน้ารูป PROFILE / MOOD & TONE */
.pc.gallery-page { padding:4cqw; justify-content:stretch; overflow:hidden; }
.gallery { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-rows:repeat(2,minmax(0,1fr)); gap:2cqw; width:100%; height:100%; }
.gallery.one { grid-template-columns:1fr; grid-template-rows:1fr; }
.gallery.mood-gallery { grid-template-columns:repeat(5,minmax(0,1fr)); grid-template-rows:1fr; gap:1cqw; }
.pc.mood-gallery-page { padding:1.2cqw 1.4cqw; }
.slot { position:relative; min-width:0; min-height:0; overflow:hidden; border:1px solid rgba(140,101,71,.4);
  background:linear-gradient(140deg,#e3d3b9,#d0bea2); display:flex; justify-content:center; align-items:center; text-align:center; }
.slot img { position:absolute; inset:0; display:none; width:100%; height:100%; object-fit:cover; object-position:var(--photo-x,50%) var(--photo-y,50%); }
.slot img.ready { display:block; transform:scale(var(--photo-zoom,1)); transform-origin:var(--photo-x,50%) var(--photo-y,50%); }
.photo-file { font:400 var(--size-image-filename)/1.45 var(--thai); padding:2cqw; color:#836c55; overflow-wrap:anywhere; }
.slot:has(img.ready) .photo-file { display:none; }
.mood-gallery .photo-file { font-size:var(--size-mood-image-filename); }
.style-name { font:500 var(--size-mood-style)/1.35 var(--head); letter-spacing:.12em; color:#a15d43; margin:4cqw 0; }
.pal { display:flex; gap:3cqw; margin-top:4cqw; }
.pal i { width:11cqw; aspect-ratio:1; border-radius:50%; box-shadow:0 0 0 1px #927d6577; }

/* ป้ายระบุหมายเลขห้อง / ประเภทพื้นที่ / โซน ให้เหมือนกันทุกหน้า */
.room-meta { font-size:var(--size-room-overline); line-height:1.5; letter-spacing:.035em; overflow-wrap:normal; }

/* หน้าห้อง: ข้อความ + รูปอ้างอิงด้านซ้าย และ Mood Board สำเร็จรูปด้านขวา */
.pc.living-details { padding:8.2cqw 8.2cqw 6.5cqw; display:flex; flex-direction:column; overflow:hidden; }
.living-details .h { font-size:var(--size-room-title); line-height:1.08; }
.living-details .detail-intro { font-size:var(--size-room-description); line-height:1.52; margin:3cqw 0 2.4cqw; }
.living-notes { display:flex; justify-content:center; align-items:center; border-top:1px solid #cfbda3; padding-top:2.2cqw; margin-top:1cqw; }
.note-heading { font:500 var(--size-room-tone-label)/1.25 var(--head); letter-spacing:.13em; color:#9b5d41; }
.living-palette { display:flex; justify-content:center; gap:1.9cqw; margin-top:1.5cqw; }
.living-palette i { width:6.3cqw; height:3.2cqw; border-radius:1cqw; box-shadow:0 0 0 1px #927d6577; }
.living-reference { position:relative; flex:1; min-height:0; margin-top:3cqw; border:1px solid #ccbaa1; background:#dbc8af; overflow:hidden; }
.living-reference img { width:100%; height:100%; display:none; object-fit:cover; object-position:var(--photo-x,50%) var(--photo-y,50%); }
.living-reference img.ready { display:block; transform:scale(var(--photo-zoom,1)); transform-origin:var(--photo-x,50%) var(--photo-y,50%); }
.ref-missing { position:absolute; inset:0; display:grid; place-items:center; font:400 var(--size-room-image-placeholder)/1.5 var(--thai); color:#715943; text-align:center; padding:3cqw; overflow-wrap:anywhere; }
.living-reference:has(img.ready) .ref-missing { display:none; }
.pc.extra-area-details .h { font-size:var(--size-room-title); }
.pc.extra-area-details .detail-intro { font-size:var(--size-room-description); line-height:1.52; margin:2.7cqw 0 2cqw; }
.pc.single-board-page { padding:3cqw; }
.single-room-board { position:relative; flex:1; min-height:0; display:flex; justify-content:center; align-items:center; background:rgba(0,0,0,.075); overflow:hidden; }
.single-room-board img { display:none; position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
.single-room-board img.ready { display:block; }
.single-board-placeholder { display:flex; flex-direction:column; gap:2.7cqw; align-items:center; color:#755c49; padding:5cqw; overflow-wrap:anywhere; }
.single-board-placeholder strong { font:500 var(--size-board-title)/1.1 var(--head); letter-spacing:.08em; }
.single-board-placeholder span { font:400 var(--size-board-roomname)/1.4 var(--thai); }
.single-board-placeholder small { font:400 var(--size-board-filename)/1.5 var(--thai); }
.single-room-board:has(img.ready) .single-board-placeholder { display:none; }

/* ========================================================
   MOOD & TONE — หน้าแรงบันดาลใจ / ตำแหน่งวงกลมสี
   ======================================================== */
.pc.mood-story-page {
  justify-content: flex-start;
  padding: 8cqw 8.2cqw 7cqw;
  overflow: hidden;
}
.mood-story-page .h {
  font-size: var(--size-mood-title);
  line-height: 1.08;
  letter-spacing: .035em;
  white-space: nowrap;
}
.mood-story-page .style-name {
  margin: 4.1cqw 0 3.6cqw;
  font: 500 var(--size-mood-style)/1.35 var(--head);
  letter-spacing: .155em;
}
.mood-story-page .detail-intro {
  margin: 0;
  font: 400 var(--size-mood-description)/1.57 var(--thai);
  color: #443328;
  overflow-wrap: anywhere;
}
/* วงกลมสีอยู่กึ่งกลางในแนวนอน ไม่ชิดซ้าย */
.mood-story-page .mood-color-wrap {
  display:flex;
  width:100%;
  justify-content:center;
  margin-top:6cqw;
}
.mood-story-page .pal {
  width:100%;
  margin:0;
  gap:2.3cqw;
  justify-content:center;
  align-items:center;
}
.mood-story-page .pal i {
  flex:0 0 9.7cqw;
  width:9.7cqw;
  height:9.7cqw;
}
.mood-inspiration {
  width:100%;
  margin-top:6.1cqw;
  padding-top:4cqw;
  border-top:1px solid rgba(115,87,64,.27);
}
.mood-inspiration h2 {
  margin:0 0 2.3cqw;
  font:500 var(--size-mood-inspiration-title)/1.35 var(--head);
  letter-spacing:.17em;
  color:#a15d43;
}
.mood-inspiration p {
  margin:0;
  font:400 var(--size-mood-inspiration-text)/1.57 var(--thai);
  color:#665142;
  overflow-wrap:anywhere;
}

// ========================================================
const $ = (sel) => document.querySelector(sel);
const esc = (value) => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const pad = n => String(n).padStart(2,'0');
const box = (content, type='') => `<div class="pc ${type}">${content}</div>`;
const heading = text => `<h1 class="h">${esc(text)}</h1>`;
const contentPage = (content, type='') => box(content, `content-page ${type}`);

// ไฟล์รูปใช้ชื่อไม่ต้องมีนามสกุล ภาพรองรับ PNG/JPG และรูปแบบอื่นใน SETTINGS
function imgTag(file, folder, alt=file) {
  // โหลดภาพทันทีแม้ยังอยู่ด้านหลังหนังสือ 3D เพื่อไม่ให้แสดงหน้าว่างเวลาเปิดหน้า
  return `<img data-photo="${esc(file)}" data-folder="${esc(folder)}" alt="${esc(alt)}">`;
}
function imageGallery(files, folder, layout='') {
  return box(`<div class="gallery ${layout}">${files.map(file =>
    `<div class="slot"><span class="photo-file">${esc(file)}</span>${imgTag(file,folder)}</div>`
  ).join('')}</div>`, `gallery-page ${layout==='mood-gallery'?'mood-gallery-page':''}`);
}
function colorsHtml(colors, circles=false) {
  return `<div class="${circles?'pal':'living-palette'}">${colors.map(c => `<i style="background:${esc(c)}"></i>`).join('')}</div>`;
}
function referenceHtml(room) {
  return `<div class="living-reference"><span class="ref-missing">ภาพตัวอย่าง ${esc(room.name)}<br>image/${esc(room.folder)}/${esc(room.reference)}.jpg หรือ .png</span>${imgTag(room.reference,room.folder,room.name)}</div>`;
}
// ป้ายหัวข้อห้องทุกหน้าใช้มาตรฐานเดียวกัน: เลขลำดับ / หมวดหน้าที่ / โซนจาก LIST OF FUNCTION
const FUNCTION_ZONE_BY_NAME = Object.fromEntries(
  Object.entries(FUNCTION_LIST).flatMap(([zone, names]) => names.map(name => [name, zone]))
);
function roomCategory(room) {
  if (['Cat Room', 'Work Space'].includes(room.name)) return 'SPECIAL FUNCTION';
  if (['Laundry Area', 'Drying Area', 'Storage Room'].includes(room.name)) return 'SERVICE AREA';
  if (FUNCTION_ZONE_BY_NAME[room.name] === 'EXTERIOR') return 'EXTERIOR AREA';
  return 'MAIN FUNCTION';
}
function roomText(room, index) {
  const zone = FUNCTION_ZONE_BY_NAME[room.name] || room.zone || 'UNASSIGNED';
  const subtitle = `ROOM ${pad(index+1)} / ${pad(ROOMS.length)} &nbsp; / &nbsp; ${roomCategory(room)} &nbsp; / &nbsp; ${zone} ZONE`;
  const html = `<p class="eyebrow room-meta">${subtitle}</p>${heading(room.name)}<span class="dash"></span>`+
    `<p class="detail-intro">${esc(room.description)}</p>`+
    `<div class="living-notes"><span class="note-heading">TONE COLOR</span></div>`+
    colorsHtml(room.colors)+referenceHtml(room);
  return contentPage(html,`room-details living-details ${index>=9?'extra-area-details':''}`);
}
function roomBoard(room) {
  return box(`<div class="single-room-board"><div class="single-board-placeholder"><strong>MOOD & TONE</strong>`+
    `<span>${esc(room.name.toUpperCase())}</span><small>image/${esc(room.folder)}/${esc(room.board)}.png หรือ .jpg</small></div>`+
    imgTag(room.board,room.folder,`${room.name} Mood Board`)+`</div>`, 'gallery-page single-board-page');
}
function profileText(profile, index) {
  const blocks=profile.blocks.map(part => `<section class="profile-block"><h3>${esc(part[0])}</h3>`+
    `<ul>${part.slice(1).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>`).join('');
  return contentPage(`<p class="eyebrow">PROFILE & LIFESTYLE / ${pad(index+1)}</p><h2 class="th">${esc(profile.title)}</h2><div class="profile-blocks">${blocks}</div>`,'profile-details');
}
function zoning(title) {
  const names = FUNCTION_LIST[title] || [];
  return `<section class="function-index-group"><h3>${esc(title)}</h3>${names.map(name =>
    `<div class="function-index-item"><span class="function-index-name">${esc(name)}</span></div>`).join('')}</section>`;
}
const functionCount = Object.values(FUNCTION_LIST).reduce((total, names) => total + names.length, 0);

// หน้าที่แสดงจริง เรียงจากปกหน้าไปจนถึงปกหลัง (ไม่มีหน้าหรือองค์ประกอบแฝง)
const PAGES = [];
const add = (markup, type='pp') => PAGES.push([markup,type]);
add(box(`<p class="eyebrow r" style="color:rgba(255,195,152,.72);letter-spacing:.22em">DESIGN PRESENTATION</p>`+
  `<h1 class="h"><span class="cl">INTERIOR</span><span class="cl">DESIGN</span></h1>`+
  `<span class="rule r"></span><p class="nm r">${esc(SETTINGS.name)}</p>`,'c cover')+
  `<p class="hint">&larr; &rarr;</p>`,'lea cover');
PROFILES.forEach((profile,index)=>{
  add(profileText(profile,index));
  add(imageGallery(profile.pics,'profile'));
});
add(contentPage(heading('USER NEEDS')+
  `<p class="detail-intro">สรุปความต้องการของอาจารย์วิวและอาจารย์หนอน \nรวมถึงยายและหลานที่จะมาเยี่ยมเป็นครั้งคราว</p>`+
  USER_NEEDS.map(([title,detail])=>`<div class="item-detail"><strong>${esc(title)}</strong><p>${esc(detail)}</p></div>`).join(''),'user-needs'));
add(imageGallery(['family-visit'],'general','one'));
add(box(`<div class="function-index-head"><p class="eyebrow"></p>`+
  `<h1 class="function-index-title">LIST OF<br>FUNCTION</h1><span class="dash"></span></div>`+
  zoning('PUBLIC')+zoning('SEMI-PUBLIC')+zoning('SEMI-PRIVATE'),'function-index-page'));
add(box(`<div class="function-index-head function-index-head-right"><span class="dash"></span></div>`+
  zoning('PRIVATE')+zoning('EXTERIOR'),'function-index-page'));
add(contentPage(heading('MOOD & TONE')+
  `<p class="style-name">${esc(SETTINGS.styleName)}</p>`+
  `<p class="detail-intro">${esc(SETTINGS.styleDescription)}</p>`+
  `<div class="mood-color-wrap">${colorsHtml(SETTINGS.styleColors,true)}</div>`+
  `<section class="mood-inspiration"><h2>INSPIRATION</h2>`+
  `<p>${esc(SETTINGS.styleInspiration)}</p></section>`, 'mood-story-page'));
add(imageGallery(SETTINGS.moodImages,'mood','mood-gallery'));
ROOMS.forEach((room,index)=>{add(roomText(room,index));add(roomBoard(room));});
add(box(`<h1 class="h"><span class="cl">THANK</span><span class="cl">YOU</span></h1><span class="rule r"></span>`+
  `<p class="nm r">${esc(SETTINGS.name)}</p>`,'c thank-you-page'));
add('');
add('<div class="arch"></div><div class="arch in"></div>','lea endcover');

// สร้างแผ่นหนังสือ 2 หน้าต่อ 1 แผ่น
const book = $('#book');
const leaves = [], faces = [];
for (let i=0;i<PAGES.length/2;i++) {
  const leaf = document.createElement('div');
  leaf.className='leaf'; leaf.style.setProperty('--i',i);
  for(let side=0;side<2;side++) {
    const page=2*i+side;
    const face=document.createElement('div');
    face.className=`pg ${side?'back':'front'} ${PAGES[page][1]}`;
    face.innerHTML=PAGES[page][0];
    leaf.appendChild(face);
    faces.push(face);
  }
  book.appendChild(leaf); leaves.push(leaf);
}
const total=leaves.length;
let position=0, turning=false;
book.style.translate='calc(var(--w) * -.5) 0';

// ========================================================
// ระบบรูป: ไม่ลบรูปเก่า ไม่เปลี่ยนชื่อเดิม และรองรับเปิด HTML เดี่ยว ๆ
//  1) image/ห้อง/ชื่อรูป.jpg|png (โฟลเดอร์ข้างไฟล์ HTML)
//  2) image/ชื่อรูป.jpg|png (แบบโฟลเดอร์เก่า)
//  3) ชื่อรูปเดิมบน GitHub Pages (สำหรับเปิดไฟล์ HTML ที่โหลดมาเดี่ยว ๆ)
// ========================================================
function loadImages() {
  const roots = [SETTINGS.imageFolder, ...SETTINGS.onlineImageFolders];
  // บังคับรูปที่หน้า 3D ถูกพับอยู่ให้เริ่มโหลดตั้งแต่แรก
  const images = [...document.querySelectorAll('img[data-photo]')];
  for (const img of images) {
    const file=img.dataset.photo;
    const subfolder=img.dataset.folder;
    const crop=SETTINGS.photoFraming[file]||{};
    img.style.setProperty('--photo-zoom',String(Math.max(1,Number(crop.zoom)||1)));
    img.style.setProperty('--photo-x',`${crop.x??50}%`);
    img.style.setProperty('--photo-y',`${crop.y??50}%`);
    const candidates=[];
    const encodedFile=encodeURIComponent(file);
    for (const root of roots) {
      const normalized=root.endsWith('/')?root:root+'/';
      for (const path of [subfolder+'/', '']) {
        for (const ext of SETTINGS.imageExtensions) {
          candidates.push(`${normalized}${path}${encodedFile}.${ext}`);
        }
      }
    }
    let attempt=0;
    function nextPhoto() {
      img.classList.remove('ready');
      if(attempt < candidates.length){img.src=candidates[attempt++];}
      else {img.removeAttribute('src');img.dataset.missing='true';}
    }
    img.addEventListener('load',()=>{
      if(img.naturalWidth>0){img.classList.add('ready');img.dataset.missing='false';}
      else nextPhoto();
    });
    img.addEventListener('error',nextPhoto);
    nextPhoto();
  }
}
loadImages();

function visiblePages() {
  faces.forEach((face,p)=>face.classList.toggle('vis',
    (position===0&&p===0)||(position===total&&p===2*total-1)||
    (position>0&&position<total&&(p===2*position-1||p===2*position))));
}
function turn(direction) {
  if(turning)return;
  if(direction>0&&position===total){return backToCover();}
  const next=position+direction;
  if(next<0||next>total)return;
  turning=true;
  const leaf=leaves[direction>0?position:next];
  leaf.classList.toggle('f',direction>0);
  leaf.classList.remove('tn'); void leaf.offsetWidth; leaf.classList.add('tn');
  position=next;
  book.style.translate=position===0?'calc(var(--w) * -.5) 0':position===total?'calc(var(--w) * .5) 0':'0 0';
  visiblePages();
  particleSpeed=8;
  setTimeout(()=>turning=false,1250);
}
function backToCover() {
  turning=true;
  let index=leaves.length-1;
  function rewind() {
    while(index>=0&&!leaves[index].classList.contains('f'))index--;
    if(index<0){position=0;book.style.translate='calc(var(--w) * -.5) 0';visiblePages();setTimeout(()=>turning=false,650);return;}
    const leaf=leaves[index];
    leaf.classList.remove('tn');void leaf.offsetWidth;leaf.classList.add('tn');leaf.classList.remove('f');
    position=index;
    book.style.translate=position===0?'calc(var(--w) * -.5) 0':'0 0';
    visiblePages(); particleSpeed=8;index--;setTimeout(rewind,58);
  }
  rewind();
}

// กดลูกศร, คลิกซ้าย/ขวา, ล้อเมาส์ หรือปัดหน้าจอเพื่อเปิดหนังสือ
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();turn(1);}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();turn(-1);}
});
addEventListener('click',e=>{if(e.target.closest('a,button'))return;turn(e.clientX>innerWidth/2?1:-1);});
addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>40)turn(e.deltaY>0?1:-1);},{passive:true});
let touchStart=0;
addEventListener('touchstart',e=>touchStart=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{const distance=e.changedTouches[0].clientX-touchStart;if(Math.abs(distance)>50)turn(distance<0?1:-1);},{passive:true});

// เอฟเฟกต์ดาวและฝุ่นในพื้นหลัง
const background=$('#bg');
for(let i=0;i<40;i++) {
  const star=document.createElement('i');star.className='star';
  star.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*60}%;animation-delay:-${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
  background.appendChild(star);
}
const canvas=$('#fx'), context=canvas.getContext('2d');
let width=0,height=0,particleSpeed=1;
const particles=[];
function resizeCanvas(){width=canvas.width=innerWidth;height=canvas.height=innerHeight;}
resizeCanvas();addEventListener('resize',resizeCanvas);
for(let i=0;i<90;i++)particles.push({x:Math.random()*width,y:Math.random()*height,v:.5+Math.random()*2,size:1+Math.random()*1.5});
function drawParticles(){
  context.clearRect(0,0,width,height);context.fillStyle='rgba(255,214,160,.5)';
  particles.forEach(p=>{p.x+=p.v*particleSpeed;p.y+=Math.sin(p.x*.01)*.3;
    if(p.x>width){p.x=0;p.y=Math.random()*height;}
    context.fillRect(p.x,p.y,p.size*particleSpeed,p.size);
  });
  particleSpeed+=(1-particleSpeed)*.03;
  requestAnimationFrame(drawParticles);
}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)drawParticles();
setTimeout(visiblePages,150);
</script>
